<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mahima's 3D Portfolio</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Fira Code', monospace;
      overflow: hidden;
    }
    header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #00ffcc;
      font-size: 2rem;
    }
    .overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
    }
    .card {
      background: rgba(20,20,20,0.9);
      border: 1px solid #00ffcc;
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
      border-color: #ff00ff;
    }
  </style>
</head>
<body>
  <header>Mahima Duggal — Software Engineer</header>
  <div class="overlay">
    <div class="card">FlexVote 🗳️ — Java, Spring Boot, MySQL</div>
    <div class="card">BuzzTalk 💬 — JavaScript, Sockets, Real-time</div>
    <div class="card">FocusFeed 📰 — APIs, JavaScript, UI/UX</div>
    <div class="card">Occasio 🎟️ — Backend, APIs, Database</div>
  </div>

  <canvas id="bg"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('bg')});
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Particles
    const geometry = new THREE.BufferGeometry();
    const particles = 5000;
    const positions = new Float32Array(particles * 3);
    for (let i = 0; i < particles * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 200;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({color: 0x00ffcc, size: 0.5});
    const points = new THREE.Points(geometry, material);
    scene.add(points);

    camera.position.z = 50;

    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.0005;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
