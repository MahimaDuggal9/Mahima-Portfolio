<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mahima's 3D Portfolio</title>
  <style>
    body { margin: 0; background: #0a0a0a; color: #e0e0e0; font-family: 'Fira Code', monospace; }
    header { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #00ffcc; font-size: 2rem; }
    .overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; }
    .card {
      background: rgba(20,20,20,0.9);
      border: 1px solid #00ffcc;
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem;
      display: inline-block;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .card:hover { transform: translateY(-10px) scale(1.05); border-color: #ff00ff; }
  </style>
</head>
<body>
  <header>> whoami Mahima Duggal — Software Engineer</header>
  <div class="overlay">
    <div class="card">FlexVote 🗳️ — Java, Spring Boot, MySQL</div>
    <div class="card">BuzzTalk 💬 — JavaScript, Sockets, Real-time</div>
    <div class="card">FocusFeed 📰 — APIs, JavaScript, UI/UX</div>
    <div class="card">Occasio 🎟️ — Backend, APIs, Database</div>
  </div>
  <canvas id="bg"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('bg')});
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Neon grid plane
    const gridHelper = new THREE.GridHelper(200, 50, 0x00ffcc, 0x00ffcc);
    scene.add(gridHelper);

    // Rotating code sphere
    const sphereGeometry = new THREE.SphereGeometry(20, 32, 32);
    const sphereMaterial = new THREE.MeshBasicMaterial({wireframe: true, color: 0xff00ff});
    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
    scene.add(sphere);

    camera.position.z = 60;

    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.y += 0.002;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
