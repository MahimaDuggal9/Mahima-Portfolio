<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mahima's Space Portfolio</title>
  <style>
    body { margin: 0; background: #000; color: #e0e0e0; font-family: 'Fira Code', monospace; }
    header { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #00ffcc; font-size: 2rem; }
    .overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; }
    .card {
      background: rgba(10,10,30,0.8);
      border: 1px solid #00ffcc;
      border-radius: 12px;
      padding: 1rem;
      margin: 1rem;
      display: inline-block;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .card:hover { transform: translateY(-10px) scale(1.05); border-color: #ff00ff; }
  </style>
</head>
<body>
  <header>🚀 Mahima Duggal — Software Engineer</header>
  <div class="overlay">
    <div class="card">About Me — Java developer, problem solver, coffee + code ☕</div>
    <div class="card">Skills — Java, Spring Boot, Databases, React, Cloud</div>
    <div class="card">Projects — FlexVote, BuzzTalk, FocusFeed, Occasio</div>
    <div class="card">Journey — Genpact SDE I, Chitkara University, Side Quests</div>
    <div class="card">Contact — GitHub, LinkedIn, LeetCode</div>
  </div>
  <canvas id="bg"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('bg')});
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Starfield
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 2000;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 500;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.7});
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Rotating code sphere
    const sphereGeometry = new THREE.SphereGeometry(30, 32, 32);
    const sphereMaterial = new THREE.MeshBasicMaterial({wireframe: true, color: 0x00ffcc});
    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
    scene.add(sphere);

    camera.position.z = 100;

    function animate() {
      requestAnimationFrame(animate);
      sphere.rotation.y += 0.002;
      stars.rotation.y += 0.0005;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
